<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>買い物リスト</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: sans-serif;
  margin: 8px;
  padding: 0;
  background-color: #f9f9f9;
}

h2 {
  text-align: center;
  font-size: 26px;
  margin-bottom: 10px;
}

.nav {
  text-align: center;
  margin-bottom: 16px;
}

.nav a {
  display: inline-block;
  padding: 10px 16px;
  background: #777;
  color: #fff;
  text-decoration: none;
  border-radius: 8px;
  font-size: 16px;
}

.section-title {
  font-size: 20px;
  margin: 18px 0 8px;
}

.section-title.none {
  color: #d32f2f;
}

.section-title.low {
  color: #e68a00;
}

.item {
  border: 1px solid #ccc;
  padding: 14px;
  margin-bottom: 10px;
  background: #fff;
  border-radius: 8px;
}

.item-name {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.buy-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.triangle-btn {
  width: 48px;
  height: 42px;
  margin: 0;
  padding: 0;
  border: none;
  border-radius: 7px;
  background: #777;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  flex-shrink: 0;
}

.qty-input {
  width: 58px;
  height: 42px;
  box-sizing: border-box;
  border: 1px solid #bbb;
  border-radius: 7px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  background: #fff;
  -moz-appearance: textfield;
}

.qty-input::-webkit-outer-spin-button,
.qty-input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.buy-btn {
  flex: 1;
  height: 42px;
  margin: 0 0 0 4px;
  padding: 0 12px;
  border: none;
  border-radius: 7px;
  background: #4CAF50;
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.empty {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 14px;
  color: #777;
  margin-bottom: 12px;
}

.toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.85);
  color: #fff;
  padding: 14px 22px;
  border-radius: 12px;
  font-size: 16px;
  opacity: 0;
  transition: opacity 0.2s ease;
  z-index: 9999;
}

.toast.show {
  opacity: 1;
}
</style>
</head>

<body>

<h2>買い物リスト</h2>

<div class="nav">
  <a href="index.html">← 在庫ページへ</a>
</div>

<div class="section-title none">無いもの</div>
<div id="none-list"></div>

<div class="section-title low">少ないもの</div>
<div id="low-list"></div>

<script>
const supabaseUrl = "https://wonwgpsupqutrujcphwr.supabase.co";
const supabaseKey = "sb_publishable_6k-VYBGmKA9Jt1uZVlrPiA_QewueM51";
const mySupabase = supabase.createClient(supabaseUrl, supabaseKey);

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

async function loadShoppingList() {
  const { data, error } = await mySupabase
    .from("products_home")
    .select("*")
    .order("name");

  if (error) {
    showToast("読み込みエラー: " + error.message);
    return;
  }

  const noneList = document.getElementById("none-list");
  const lowList = document.getElementById("low-list");

  noneList.innerHTML = "";
  lowList.innerHTML = "";

  const noneItems = data.filter(product => Number(product.stock) === 0);
  const lowItems  = data.filter(product => Number(product.stock) === 1);

  renderItems(noneList, noneItems, "無いものはありません");
  renderItems(lowList, lowItems, "少ないものはありません");

  attachEvents();
}

function renderItems(container, items, emptyMessage) {
  if (items.length === 0) {
    container.innerHTML = `<div class="empty">${emptyMessage}</div>`;
    return;
  }

  items.forEach(product => {
    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <div class="item-name">${escapeHtml(product.name)}</div>

      <div class="buy-row">
        <button class="triangle-btn qty-minus"
          data-id="${product.id}"
          aria-label="買う数を1減らす">◀</button>

        <input
          class="qty-input"
          id="qty-${product.id}"
          type="number"
          inputmode="numeric"
          min="1"
          step="1"
          value="1"
          aria-label="${escapeHtml(product.name)}を買った数">

        <button class="triangle-btn qty-plus"
          data-id="${product.id}"
          aria-label="買う数を1増やす">▶</button>

        <button class="buy-btn"
          data-id="${product.id}"
          data-stock="${product.stock}">
          買った
        </button>
      </div>
    `;

    container.appendChild(div);
  });
}

function attachEvents() {
  document.querySelectorAll(".qty-minus").forEach(btn => {
    btn.onclick = () => {
      const input = document.getElementById("qty-" + btn.dataset.id);
      let value = parseInt(input.value, 10);

      if (!Number.isFinite(value)) value = 1;
      input.value = Math.max(1, value - 1);
    };
  });

  document.querySelectorAll(".qty-plus").forEach(btn => {
    btn.onclick = () => {
      const input = document.getElementById("qty-" + btn.dataset.id);
      let value = parseInt(input.value, 10);

      if (!Number.isFinite(value)) value = 1;
      input.value = value + 1;
    };
  });

  document.querySelectorAll(".qty-input").forEach(input => {
    input.onfocus = () => input.select();

    input.onchange = () => {
      let value = parseInt(input.value, 10);

      if (!Number.isFinite(value) || value < 1) {
        input.value = 1;
      } else {
        input.value = value;
      }
    };
  });

  document.querySelectorAll(".buy-btn").forEach(btn => {
    btn.onclick = () => registerPurchase(
      btn.dataset.id,
      Number(btn.dataset.stock),
      btn
    );
  });
}

async function registerPurchase(id, currentStock, button) {
  const input = document.getElementById("qty-" + id);
  let bought = parseInt(input.value, 10);

  if (!Number.isFinite(bought) || bought < 1) {
    showToast("買った数は1以上で入力してください");
    input.value = 1;
    return;
  }

  button.disabled = true;
  button.textContent = "登録中…";

  const newStock = currentStock + bought;

  const { error } = await mySupabase
    .from("products_home")
    .update({
      stock: newStock,
      updated_at: new Date()
    })
    .eq("id", id);

  if (error) {
    button.disabled = false;
    button.textContent = "買った";
    showToast("登録エラー: " + error.message);
    return;
  }

  showToast(`${bought}個 登録しました`);
  loadShoppingList();
}

function showToast(message) {
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.innerText = message;
  document.body.appendChild(toast);

  setTimeout(() => toast.classList.add("show"), 10);

  setTimeout(() => {
    toast.classList.remove("show");
    setTimeout(() => toast.remove(), 200);
  }, 1200);
}

loadShoppingList();
</script>

</body>
</html>
